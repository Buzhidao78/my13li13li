server:
  port: 8080

spring:
  application:
    name: practice2-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接串/账号/密码可通过环境变量覆盖（生产环境务必设置 DB_PASSWORD，勿用默认值）
    # DB_HOST/DB_PORT：Docker 编排时注入服务名 mysql，本地开发默认 localhost
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/video_community?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  # Redis 配置（默认本机 6379，无需密码；Docker 编排时注入服务名 redis）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0

  # RabbitMQ 配置（默认本机 5672，guest/guest 仅限本机访问；Docker 编排时注入服务名 rabbitmq）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 生产者 confirm：消息投递到交换机后，RabbitMQ 会回调确认结果（可靠投递的关键）
    publisher-confirm-type: correlated
    # 生产者 return：消息路由不到任何队列时，回调通知（配合 confirm 判断消息是否真正入队）
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK：消费者处理成功才确认；失败可以重回队列，保证消息不丢
        acknowledge-mode: manual
        # 单消费者接收消息数：不限制并发，方便观察日志
        prefetch: 1

# 订单业务相关配置（练习用）
order:
  # 未支付订单自动关闭的延时（毫秒）：练习时设短一点（如 30 秒）方便观察延时关单效果
  ttl-ms: 30000

# 文件上传配置（视频模块）
file:
  # 上传文件存储根目录：相对路径，相对后端启动目录（backend/ 下会生成 upload/ 文件夹）
  # 目录里的文件通过 /upload/** 静态映射对外访问（见 config/WebConfig.java）
  # Docker 部署时通过环境变量 FILE_UPLOAD_DIR 指向持久化卷 /app/upload
  upload-dir: ${FILE_UPLOAD_DIR:./upload}

# JWT 配置：secret 要足够长（>=32字节）
# 默认值仅供本地开发；生产环境必须通过环境变量 JWT_SECRET 传入随机字符串
jwt:
  secret: ${JWT_SECRET:practice2-jwt-secret-key-please-change-it-0123456789}
  # token 有效期：毫秒，默认 7 天
  expire: ${JWT_EXPIRE:604800000}

mybatis-plus:
  configuration:
    # 下划线转驼峰：数据库字段 create_time -> Java 属性 createTime
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，方便练习时观察
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除字段配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
