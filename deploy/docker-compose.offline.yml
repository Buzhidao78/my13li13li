# =========================================================
# 视频社区离线部署编排（服务器无外网时使用）
# 与 docker-compose.yml 的唯一区别：去掉 build 指令，直接用 docker load 导入的镜像
# 使用：
#   1) 本机：docker save 导出全部 5 个镜像 → tar.gz 传到服务器
#      docker save video-community-backend:latest video-community-frontend:latest mysql:8.0 redis:7-alpine rabbitmq:3.13-management -o video-community-images.tar
#      tar -zcf video-community-images.tar.gz video-community-images.tar
#   2) 服务器：解压并导入镜像
#      tar -xzf video-community-images.tar.gz && docker load -i video-community-images.tar
#   3) 服务器：准备 .env（复制 .env.example）并启动
#      cp deploy/.env.example .env   # 填写强密码
#      docker compose -f deploy/docker-compose.offline.yml up -d
# 前提：服务器已安装 Docker（含 compose 插件），且部署目录保留了
#       backend/src/main/resources/db/init.sql（首启初始化数据库用）
# =========================================================
services:
  mysql:
    image: mysql:8.0
    container_name: video-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: video_community
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: video-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: video-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-video_community}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-video_community123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    image: video-community-backend:latest
    container_name: video-backend
    restart: unless-stopped
    environment:
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-video_community}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-video_community123}
      FILE_UPLOAD_DIR: /app/upload
      JWT_SECRET: ${JWT_SECRET:-practice2-jwt-secret-key-please-change-it-0123456789}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - upload_data:/app/upload
    ports:
      - "8080:8080"

  frontend:
    image: video-community-frontend:latest
    container_name: video-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  upload_data:
