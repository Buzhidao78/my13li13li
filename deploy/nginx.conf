# =========================================================
# 视频社区服务器主机 Nginx 配置（云服务器上独立安装的 nginx）
# 职责：
#   /          -> 前端静态页面容器 (127.0.0.1:8090)
#   /api/      -> 后端 REST 接口   (127.0.0.1:8080)
#   /upload/   -> 后端视频/封面文件静态映射 (127.0.0.1:8080)
#   /ws        -> 私信 WebSocket 实时推送 (127.0.0.1:8080)
# 使用：放在 /etc/nginx/nginx.conf 或 /etc/nginx/conf.d/ 下后 nginx -s reload
# =========================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 视频上传体积较大，默认 1m 会被拒，这里放宽到 100m
    client_max_body_size 100m;

    # 后端服务地址（容器映射到宿主机的端口）
    upstream video_backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name _;

        # 全局代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ---------- 1. 后端 REST API ----------
        location /api/ {
            proxy_pass http://video_backend;
        }

        # ---------- 2. 上传文件（视频/封面静态映射） ----------
        # 注意：不带尾斜杠的 proxy_pass 会保留 /upload 前缀转发给后端
        location /upload/ {
            proxy_pass http://video_backend;
        }

        # ---------- 3. 私信 WebSocket ----------
        # 必须升级连接协议，否则前端 ws:// 握手失败
        location /ws {
            proxy_pass http://video_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # 长连接：私信长时间挂载，超时设长一点
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- 4. 前端静态页面 ----------
        location / {
            proxy_pass http://127.0.0.1:8090;
        }
    }
}
