# =========================================================
# 视频社区一键编排：mysql + redis + rabbitmq + backend + frontend
# 使用：
#   1) 复制 .env.example 为 .env 并填写密码/密钥（不填也能跑，使用默认值）
#   2) 在项目根目录执行：docker compose -f deploy/docker-compose.yml up -d --build
#   3) 本地验证：浏览器打开 http://localhost:8090
#   4) 重新初始化数据库（重建全部数据）：docker compose -f deploy/docker-compose.yml down -v
#      （init.sql 只在 mysql 数据卷为空的首启时执行一次；-v 会删掉 mysql/redis 等数据卷）
# 安全约定：mysql/redis/rabbitmq 只在内网互通，不映射公网端口；
#           唯一对外入口是 frontend:8090 和 backend:8080（由服务器 nginx 反代）
# =========================================================
services:
  mysql:
    image: mysql:8.0
    container_name: video-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: video_community
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # 首次初始化时自动建库建表并导入种子数据（仅数据卷为空时执行一次）
      - ../backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: video-redis
    restart: unless-stopped
    # 开启 AOF 持久化，Redis 重启不丢数据（搜索热词/验证码等）
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: video-rabbitmq
    restart: unless-stopped
    environment:
      # 注意：不要用默认 guest/guest 跨容器连接（RabbitMQ 限制 guest 仅本机回环可登录）。
      # 这里默认给非 guest 账号，开箱即用；生产环境务必在 .env 覆盖成强密码。
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-video_community}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-video_community123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    image: video-community-backend:latest
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: video-backend
    restart: unless-stopped
    environment:
      # 通过环境变量注入：本地开发默认值（localhost/root/123456）在 .env 中被覆盖
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-video_community}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-video_community123}
      FILE_UPLOAD_DIR: /app/upload
      JWT_SECRET: ${JWT_SECRET:-practice2-jwt-secret-key-please-change-it-0123456789}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      # 视频/封面文件持久化（最贵的资产，务必保留）
      - upload_data:/app/upload
    ports:
      - "8080:8080"

  frontend:
    image: video-community-frontend:latest
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: video-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  upload_data:
