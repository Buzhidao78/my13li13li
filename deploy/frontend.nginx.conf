# =========================================================
# 前端容器内部 Nginx 配置
# 职责（双层 nginx 设计）：
#   - 本地 Docker Desktop 直连 localhost:8090 时：本站负责
#     静态托管 + /api、/upload、/ws 反代到后端容器（backend:8080）
#   - 云服务器上：宿主机 nginx 的 location /api|/upload|/ws 优先匹配，
#     只有 / 会走到本容器；本配置中的反代规则不会被命中，无冲突
# =========================================================

server {
    listen 80;
    server_name _;

    # 视频上传走 /api/video/upload，默认 1m 限制会拒绝大文件
    client_max_body_size 100m;

    # ---------- 前端静态页面（Vue Router history 模式需要 try_files 回退） ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 找不到真实文件时回退到 index.html，交给 Vue Router 处理（防刷新 404）
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 REST API（本地直连时使用；云服务器由宿主机 nginx 拦截） ----------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 上传文件（视频/封面静态映射） ----------
    location /upload/ {
        proxy_pass http://backend:8080;
    }

    # ---------- 私信 WebSocket（必须升级协议，否则握手失败） ----------
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
